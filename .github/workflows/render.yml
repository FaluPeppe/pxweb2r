name: Render pxweb2r.qmd for GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - pxweb2r.qmd
      - .github/workflows/render.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Install R packages needed to render .qmd
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown"))'

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render pxweb2r.qmd to docs/index.html
        run: |
          quarto render pxweb2r.qmd --to html
          mkdir -p docs
          mv pxweb2r.html docs/index.html
          rm -rf docs/pxweb2r_files
          if [ -d pxweb2r_files ]; then mv pxweb2r_files docs/pxweb2r_files; fi

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Render pxweb2r.qmd for GitHub Pages [skip ci]"
          file_pattern: docs/
